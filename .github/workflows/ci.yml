name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint all projects
        run: npx nx run-many -t lint --all

      - name: Run unit tests
        run: npx nx run-many -t test --all

      - name: Build all apps
        run: npx nx run-many -t build --all

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test-build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create env file for CI
        run: cp .env.example .env

      - name: Start infrastructure and microservices
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d postgres auth-microservice user-microservice task-microservice
        env:
          # Build the schema from migrations, as in production, so broken or
          # missing migrations fail CI.
          DB_SYNCHRONIZE: 'false'

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U admin -d task-management && exit 0
            sleep 2
          done
          exit 1

      # The microservices only start listening after their migrations have
      # run, so the seed below never races the schema creation.
      - name: Wait for microservices
        run: |
          for port in 4001 4002 4003; do
            for i in $(seq 1 60); do
              (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              if [ "$i" = 60 ]; then
                docker compose -f docker-compose.yml -f docker-compose.override.yml logs --tail 50
                exit 1
              fi
              sleep 2
            done
          done

      - name: Seed demo data
        run: npm run seed:all
        env:
          USER_DB_HOST: localhost
          USER_DB_PORT: 5433
          TASK_DB_HOST: localhost
          TASK_DB_PORT: 5433
          USER_DB_USERNAME: admin
          TASK_DB_USERNAME: admin
          NODE_ENV: development

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # The gateway under test runs on the runner, outside the Docker
          # network, so it reaches the microservices through the loopback
          # ports published by docker-compose.override.yml. These override the
          # Docker service names copied from .env.example.
          USER_MS_HOST: localhost
          TASK_MS_HOST: localhost
          AUTH_MS_HOST: localhost

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml down -v
