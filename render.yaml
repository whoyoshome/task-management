# Render Blueprint for the free public demo: the whole backend in one web
# service (docker/demo/Dockerfile), with Postgres on Neon. See
# docs/DEPLOYMENT.md, "Free public demo".
services:
  - type: web
    name: task-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/demo/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Neon's direct (non-pooled) connection string. docker/demo/
      # database-url.js expands it for the three services.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: DB_SYNCHRONIZE
        value: 'false'
      - key: USER_DB_SCHEMA
        value: users
      - key: TASK_DB_SCHEMA
        value: tasks
      - key: AUTH_DB_SCHEMA
        value: auths

      # Secrets generated by Render, never typed by hand.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # The Vercel origin(s) the browser calls from (comma-separated, *
      # wildcards allowed), e.g. https://task-management.vercel.app
      - key: FRONTEND_API_URL
        sync: false
      # Rate-limit key. Render passes X-Forwarded-For on as the client sent
      # it, so no TRUST_PROXY value makes it trustworthy here; Cloudflare,
      # in front of every onrender.com request, sets and overwrites
      # CF-Connecting-IP. Through Vercel this is a Vercel edge address.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: TRUST_PROXY
        value: '1'

      # Swagger
      - key: SITE_TITLE
        value: Task Management API
      - key: DOC_TITLE
        value: Task Management API
      - key: DOC_DESCRIPTION
        value: REST API for task and project management
      - key: DOC_VERSION
        value: '1.0'
