services:
  # Dev/CI only: expose the TCP microservices on loopback so a gateway running
  # on the host (e.g. the e2e suite) can reach them. Never publish them on
  # 0.0.0.0: they accept unauthenticated commands such as generate_tokens.
  auth-microservice:
    ports:
      - '127.0.0.1:4003:4003'

  user-microservice:
    ports:
      - '127.0.0.1:4001:4001'

  task-microservice:
    ports:
      - '127.0.0.1:4002:4002'

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: task-management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 654321
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d task-management']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seed:
    build:
      context: .
      dockerfile: docker/seed/Dockerfile
    container_name: seed
    env_file:
      - .env
    environment:
      USER_DB_HOST: postgres
      TASK_DB_HOST: postgres
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      user-microservice:
        condition: service_started
      task-microservice:
        condition: service_started
    restart: 'no'

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    user: root
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin_data:
