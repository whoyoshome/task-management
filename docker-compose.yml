services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/node-service/Dockerfile
      args:
        APP: api-gateway
    container_name: api-gateway
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - auth-microservice
      - user-microservice
      - task-microservice
      - postgres
    mem_limit: 4g

  auth-microservice:
    build:
      context: .
      dockerfile: docker/node-service/Dockerfile
      args:
        APP: auth-microservice
    container_name: auth-microservice
    # No published ports: the TCP microservices have no authentication and must
    # only be reachable by the api-gateway over the internal Docker network.
    env_file:
      - .env
    depends_on:
      - postgres
    mem_limit: 4g

  user-microservice:
    build:
      context: .
      dockerfile: docker/node-service/Dockerfile
      args:
        APP: user-microservice
    container_name: user-microservice
    env_file:
      - .env
    depends_on:
      - postgres
    mem_limit: 4g

  task-microservice:
    build:
      context: .
      dockerfile: docker/node-service/Dockerfile
      args:
        APP: task-microservice
    container_name: task-microservice
    env_file:
      - .env
    depends_on:
      - postgres
    mem_limit: 4g

  client-app:
    build:
      context: .
      dockerfile: apps/client-app/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: client-app
    ports:
      - '5173:8080'
    depends_on:
      - api-gateway
    mem_limit: 1g
